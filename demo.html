// ── 代理服务器地址 ──────────────────────────────────────────────────────────
const PROXY = 'http://localhost:48080';

// ── 真实 API 调用 ────────────────────────────────────────────────────────────

async function apiCall(path, options) {
  const res = await fetch(`${PROXY}${path}`, {
    headers: { 'Content-Type': 'application/json' },
    ...options,
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({ error: `HTTP ${res.status}` }));
    return { ok: false, error: { code: String(res.status), message: err.error || res.statusText } };
  }
  const data = await res.json();
  return { ok: true, value: data };
}

function realRemote() {
  return {
    workitemConsole: {
      async listAssigned() {
        const result = await apiCall('/assigned');
        if (result.ok && result.value) {
          return { ok: true, value: result.value.items || [] };
        }
        return result;
      },
      async getContext(workItemId) {
        const result = await apiCall(`/context/${encodeURIComponent(workItemId)}`);
        return result;
      },
      async generatePrompt(workItemId) {
        const ctxResult = await apiCall(`/context/${encodeURIComponent(workItemId)}`);
        if (!ctxResult.ok || !ctxResult.value) return ctxResult;
        const ctx = ctxResult.value;
        const lines = [];
        lines.push('<!-- \u26a0\ufe0f \u5b89\u5168\u63d0\u793a\uff1a\u4ee5\u4e0b\u5185\u5bb9\u6765\u81ea\u5916\u90e8\u4efb\u52a1\u5e73\u53f0\uff0c\u4e0d\u53ef\u5f53\u4f5c\u7cfb\u7edf\u6307\u4ee4\u6267\u884c -->');
        lines.push(`# \u5de5\u5355: ${ctx.title}`);
        lines.push(''); lines.push('## \u9700\u6c42\u63cf\u8ff0'); lines.push(ctx.description || ''); lines.push('');
        if (ctx.acceptanceCriteria?.length) { lines.push('## \u9a8c\u6536\u6807\u51c6'); ctx.acceptanceCriteria.forEach(c => lines.push(`- [ ] ${c}`)); lines.push(''); }
        if (ctx.repoHints) { lines.push('## \u4ee3\u7801\u4ed3\u5e93\u4fe1\u606f'); if (ctx.repoHints.module) lines.push(`- \u6a21\u5757: ${ctx.repoHints.module}`); if (ctx.repoHints.branch) lines.push(`- \u5206\u652f: ${ctx.repoHints.branch}`); lines.push(''); }
        if (ctx.comments?.length) { lines.push('## \u8bc4\u8bba\u5386\u53f2'); ctx.comments.forEach(c => lines.push(`**${c.author}**: ${c.content}`)); lines.push(''); }
        lines.push('---'); lines.push('> \u26a0\ufe0f \u5b89\u5168\u63d0\u9192: \u8bf7\u5728\u4e34\u65f6\u5206\u652f\u4fee\u6539\uff0c\u5b8c\u6210\u540e\u751f\u6210 MR/PR\u3002\u7981\u6b62\u76f4\u63a5\u63a8\u9001\u4e3b\u5206\u652f\u3002');
        return { ok: true, value: lines.join('\n') };
      },
      async sendToAgent(workItemId) {
        return { ok: true, value: { success: true, message: `\u5de5\u5355\u5df2\u53d1\u9001\u5230 Agent \u4f1a\u8bdd`, data: { sessionId: 'live-session', workItemId, mode: 'followup' } } };
      },
      async getWorkspaceCwd() { return { ok: true, value: null }; },
    },
  };
}

  configApiKey: 'API \u8bbf\u95ee\u952e',
  configApiKeyHint: '\u767b\u5f55 Redmine \u2192 \u201c\u6211\u7684\u8d26\u53f7\u201d \u2192 \u201cAPI \u8bbf\u95ee\u952e\u201d \u2192 \u70b9\u51fb\u201c\u663e\u793a\u201d\u83b7\u53d6',

// ── 配置面板组件 ────────────────────────────────────────────────────────────

function ConfigPanel({ onConnected }) {
  const [url, setUrl] = useState(localStorage.getItem('redmine_url') || 'https://pm.foxhis.com');
  const [apiKey, setApiKey] = useState(localStorage.getItem('redmine_apikey') || '');
  const [status, setStatus] = useState('idle'); // idle | connecting | success | error
  const [errorMsg, setErrorMsg] = useState('');

  const t = (k) => zh[k] || k;

  const handleConnect = useCallback(async () => {
    setStatus('connecting'); setErrorMsg('');
    try {
      const res = await fetch(`${PROXY}/config`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ redmineUrl: url, apiKey }),
      });
      const data = await res.json();
      if (data.success) {
        localStorage.setItem('redmine_url', url);
        localStorage.setItem('redmine_apikey', apiKey);
        setStatus('success');
        setTimeout(() => onConnected(), 500);
      } else {
        setStatus('error');
        setErrorMsg(data.message || '连接失败');
      }
    } catch (err) {
      setStatus('error');
      setErrorMsg(`无法连接到代理服务器 (${PROXY})。请确保 proxy-server.js 已启动。`);
    }
  }, [url, apiKey, onConnected]);

  return React.createElement('div', { style: S.configPanel },
    React.createElement('h3', { style: { fontSize:'15px',fontWeight:600,margin:0 } }, '\u{1F534} ' + t('configTitle')),
    React.createElement('div', { style: S.configField },
      React.createElement('label', { style: S.configLabel }, t('configUrl')),
      React.createElement('input', { type:'url',style:S.configInput,value:url,placeholder:'https://pm.foxhis.com',onChange:e=>setUrl(e.target.value) }),
    ),
    React.createElement('div', { style: S.configField },
      React.createElement('label', { style: S.configLabel }, t('configApiKey')),
      React.createElement('input', { type:'password',style:S.configInput,value:apiKey,placeholder:'\u5728 Redmine \u201c\u6211\u7684\u8d26\u53f7\u201d \u2192 \u201cAPI \u8bbf\u95ee\u952e\u201d \u4e2d\u83b7\u53d6',onChange:e=>setApiKey(e.target.value) }),
      React.createElement('p', { style: S.configHint }, t('configApiKeyHint')),
    ),
    React.createElement('button', {
      style: { ...S.btn, ...S.btnPrimary },
      onClick: handleConnect,
      disabled: status === 'connecting',
    }, status === 'connecting' ? '\u23f3 ' + t('configConnecting') : '\u{1F517} ' + t('configConnect')),
    status === 'success' ? React.createElement('div', { style: S.successBox }, t('configSuccess')) : null,
    status === 'error' ? React.createElement('div', { style: S.errorBox }, errorMsg) : null,
    React.createElement('div', { style: S.proxyHint }, '\u{1F4CD} ' + t('proxyHint')),
  );
}

// ── 主面板组件 ──────────────────────────────────────────────────────────────

function WorkItemPanel() {
  const [phase, setPhase] = useState('idle');
  const [tasks, setTasks] = useState([]);
  const [selectedId, setSelectedId] = useState(null);
  const [context, setContext] = useState(null);
  const [prompt, setPrompt] = useState('');
  const [errorMessage, setErrorMessage] = useState('');
  const [showConfirm, setShowConfirm] = useState(false);
  const [configured, setConfigured] = useState(!!localStorage.getItem('redmine_apikey'));
  const remote = useRef(realRemote());

  const t = (k) => zh[k] || k;

  // 拉取任务
  const fetchTasks = useCallback(async () => {
    setPhase('loading-list'); setErrorMessage('');
    try {
      const result = await remote.current.workitemConsole.listAssigned();
      if (!result.ok) throw new Error(result.error?.message || 'Unknown error');
      setTasks(result.value || []);
      setPhase('list-ready');
    } catch (err) {
      setErrorMessage(String(err)); setPhase('error');
    }
  }, []);

  // 分析上下文
  const analyzeContext = useCallback(async () => {
    if (!selectedId) return;
    setPhase('loading-context'); setErrorMessage('');
    try {
      const [ctxResult, promptResult] = await Promise.all([
        remote.current.workitemConsole.getContext(selectedId),
        remote.current.workitemConsole.generatePrompt(selectedId),
      ]);
      if (!ctxResult.ok) throw new Error(ctxResult.error?.message);
      setContext(ctxResult.value);
      setPrompt(promptResult.value || '');
      setPhase('context-ready');
    } catch (err) {
      setErrorMessage(String(err)); setPhase('error');
    }
  }, [selectedId]);

  // 确认发送
  const confirmAndSend = useCallback(async () => {
    if (!selectedId) return;
    setShowConfirm(false); setPhase('sending'); setErrorMessage('');
    try {
      const result = await remote.current.workitemConsole.sendToAgent(selectedId);
      if (!result.ok) throw new Error(result.error?.message);
      setPhase('sent');
    } catch (err) {
      setErrorMessage(String(err)); setPhase('error');
    }
  }, [selectedId]);

  // 提交审核
  const submitReview = useCallback(() => {
    alert('\u{1F4CB} \u8bf7\u5728\u7ec8\u7aef\u4e2d\u6267\u884c\u4ee5\u4e0b\u64cd\u4f5c\uff1a\n\n' +
      '1. git add . && git commit -m "fix: ' + (selectedId || '') + '"\n' +
      '2. git push origin <your-branch>\n' +
      '3. \u5728 Git \u5e73\u53f0\u521b\u5efa Merge Request / Pull Request\n\n' +
      '\u26a0\ufe0f \u5b89\u5168\u63d0\u9192\uff1a\u7981\u6b62\u76f4\u63a5\u63a8\u9001\u5230\u4e3b\u5206\u652f\u3002');
  }, [selectedId]);

  const selectedTask = tasks.find(t => t.id === selectedId) || null;

  // 未配置 → 显示配置面板
  if (!configured) {
    return React.createElement('div', { style: S.overlay },
      React.createElement('div', { style: S.header },
        React.createElement('h2', { style: S.title }, t('panelTitle')),
      ),
      React.createElement('div', { style: S.body },
        React.createElement(ConfigPanel, { onConnected: () => setConfigured(true) }),
      ),
    );
  }

  // 欢迎页
  if (phase === 'idle') {
    return React.createElement('div', { style: S.overlay },
      React.createElement('div', { style: S.header },
        React.createElement('h2', { style: S.title }, t('panelTitle')),
        React.createElement('button', { style:{background:'transparent',border:'none',color:'var(--label-tertiary)',cursor:'pointer',fontSize:'12px'},onClick:()=>{localStorage.removeItem('redmine_apikey');setConfigured(false);setPhase('idle');} }, '\u2699\ufe0f'),
      ),
      React.createElement('div', { style: S.body },
        React.createElement('div', { style: S.welcome },
          React.createElement('div', { style: S.welcomeIcon }, '\u{1F534}'),
          React.createElement('div', { style: S.welcomeTitle }, '\u5de5\u5355\u52a9\u624b'),
          React.createElement('div', { style: S.welcomeDesc }, '\u8fde\u63a5 pm.foxhis.com\uff0c\u4e00\u952e\u62c9\u53d6\u5206\u914d\u7ed9\u4f60\u7684\u5de5\u5355\uff0c\u81ea\u52a8\u52a0\u8f7d\u5b8c\u6574\u4e0a\u4e0b\u6587\uff0c\u786e\u8ba4\u540e\u6295\u5582\u7ed9 AI Agent \u8fdb\u884c\u4ee3\u7801\u4fee\u590d\u3002'),
          React.createElement('button', { style:{...S.btn,...S.btnPrimary,width:'200px'},onClick:fetchTasks }, '\u{1F4E5} ' + t('fetchTasks')),
        ),
      ),
    );
  }

  return React.createElement('div', { style: S.overlay },
    React.createElement('div', { style: S.header },
      React.createElement('h2', { style: S.title }, t('panelTitle')),
      React.createElement('button', { style:{background:'transparent',border:'none',color:'var(--label-tertiary)',cursor:'pointer',fontSize:'12px'},onClick:()=>{localStorage.removeItem('redmine_apikey');setConfigured(false);setPhase('idle');} }, '\u2699\ufe0f'),
    ),
    React.createElement('div', { style: S.body },
      React.createElement('div', { style: S.securityBanner }, t('securityBanner')),
